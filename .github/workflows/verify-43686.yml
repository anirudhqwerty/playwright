name: Focused PR 43686 investigation
on:
  push:
    branches: [verify/pr-43686]
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium chrome
      - name: Record revision and browser versions
        run: |
          git rev-parse HEAD
          node --version
          google-chrome --version
      - name: Run original scenario with raw response diagnostics
        run: |
          node investigation/pr43686.cjs baseline
          set +e
          npm run test-mcp -- run-code --project=chrome --grep '^browser_run_code_unsafe$' --retries=0 --reporter=line > evidence/original.log 2>&1
          status=$?
          set -e
          cat evidence/original.log
          printf '%s\n' "$status" > evidence/original-status.txt
          test "$status" -eq 1
          grep -F 'Received undefined' evidence/original.log
      - name: Test body consumption hypothesis
        run: |
          node investigation/pr43686.cjs consume
          npm run test-mcp -- run-code --project=chrome --grep '^browser_run_code_unsafe$' --retries=0 --reporter=line 2>&1 | tee evidence/consume.log
      - name: Existing run-code and delayed-event regression
        run: |
          node investigation/pr43686.cjs delayed
          npm run test-mcp -- run-code --project=chrome --project=chromium --workers=1 --retries=0 --reporter=line 2>&1 | tee evidence/regressions.log
      - name: Save candidate diff
        if: always()
        run: git diff > evidence/candidate.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr43686-linux-evidence
          path: |
            evidence/
            test-results/
